<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelegateAI | Stealth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #050505; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            margin: 0;
            overflow: hidden;
        }
        
        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(14, 165, 233, 0.05) 0%, rgba(5, 5, 5, 1) 70%);
            z-index: 0;
            pointer-events: none;
        }

        #logo-animation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .gradient-text {
            background: linear-gradient(135deg, #38bdf8, #818cf8, #38bdf8);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .glow-btn {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glow-btn:hover {
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
            transform: translateY(-2px);
        }

        .animate-fade-in {
            animation: fadeIn 1.2s ease-out forwards;
            opacity: 0;
        }

        .delay-100 { animation-delay: 100ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center relative hero-bg">
    
    <div class="bg-glow"></div>
    <canvas id="logo-animation-canvas"></canvas>

    <div class="relative z-10 text-center px-6 max-w-4xl w-full hero-content">
        
        <div class="animate-fade-in delay-100 mb-8 inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-white/10 bg-white/5 backdrop-blur-sm text-xs font-semibold tracking-wider text-gray-400 uppercase">
            <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
            Project Delegate-Stock
        </div>

        <h1 class="animate-fade-in delay-300 text-5xl md:text-7xl font-extrabold tracking-tight mb-6 leading-tight">
            The signal in the <br>
            <span class="gradient-text">financial noise.</span>
        </h1>

        <p class="animate-fade-in delay-500 text-lg md:text-xl text-gray-400 mb-12 leading-relaxed max-w-2xl mx-auto">
            We are engineering an intelligent agent that reads between the lines of the market so you don't have to. Real-time data, pure insight.
        </p>

        <div class="animate-fade-in delay-500 relative z-20">
            <form class="flex flex-col sm:flex-row gap-3 justify-center max-w-md mx-auto" action="/submit" method="POST">
                <input 
                    type="text" 
                    name="contact_id"
                    placeholder="Enter Email or Telegram ID" 
                    class="px-5 py-3.5 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 w-full sm:w-auto flex-1 backdrop-blur-md transition-all"
                    required
                >
                <button 
                    type="submit" 
                    class="glow-btn bg-gradient-to-r from-sky-400 to-indigo-500 text-white font-bold py-3.5 px-8 rounded-xl whitespace-nowrap cursor-pointer"
                >
                    Request Beta Access
                </button>
            </form>
            <p class="mt-4 text-xs text-gray-600">Invites are currently limited for the closed beta.</p>
        </div>
    </div>

    <div class="absolute bottom-6 text-gray-600 text-xs w-full text-center z-10">
        &copy; 2026 DelegateAI. Operating in Stealth.
    </div>

    <script src="logo-animation.js"></script>
</body>
</html>
